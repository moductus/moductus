[package]
name = "moductus"
version = "0.5.0-alpha"
description = "Moductus — o seu dia no PC, num dock só"
authors = ["Gustavo Cremonez"]
license = "MIT"
edition = "2021"

[lib]
name = "moductus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_WinRT",
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

# Só para examples/sessao_midia.rs, a sessão de mídia do roteiro.
[dev-dependencies]
windows = { version = "0.62", features = ["Media", "Media_Core", "Media_Playback"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
