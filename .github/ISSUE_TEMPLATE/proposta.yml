name: Proposta
description: Propor uma área, um agente, uma integração ou uma ferramenta
title: "[Proposta] "
labels: ["proposta"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de preencher, vale ler os [princípios](https://github.com/moductus/moductus/blob/main/docs/PRODUCT.md#2-princípios) e os [não-objetivos](https://github.com/moductus/moductus/blob/main/docs/PRODUCT.md#não-objetivos).

  - type: dropdown
    id: tipo
    attributes:
      label: Tipo
      options:
        - Área nova (no Sistema e no dock)
        - Agente novo
        - Integração (serviço externo ou agente de código)
        - Ferramenta para os agentes
        - Utilitário em Ferramentas
    validations:
      required: true

  - type: textarea
    id: dor
    attributes:
      label: Qual dor resolve
      description: O problema concreto, não a funcionalidade. Descreva a situação em que você hoje perde tempo.
    validations:
      required: true

  - type: textarea
    id: sem-ia
    attributes:
      label: Como os agentes usam isso
      description: Quais ferramentas o agente ganha, o que ele faz sozinho e o que precisa da sua aprovação.
    validations:
      required: true

  - type: textarea
    id: dados
    attributes:
      label: Dados e rede
      description: O que fica guardado, o que vai para o modelo e o que sai para a rede. "Nada" é uma resposta válida.
    validations:
      required: true

  - type: textarea
    id: alternativas
    attributes:
      label: O que já existe que faz isso
      description: Nomeie as ferramentas que já resolvem, e diga por que ainda vale ter isso aqui.
    validations:
      required: true

  - type: checkboxes
    id: principios
    attributes:
      label: Cabe nos princípios
      options:
        - label: A regra de negócio fica na área, não no prompt
          required: true
        - label: Nenhuma ação externa acontece sem aprovação
          required: true
        - label: Nenhum dado sai do computador sem o usuário ligar a conexão
          required: true
