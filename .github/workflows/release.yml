name: release

# Dispara com tag: git tag v0.5.0-alpha && git push origin v0.5.0-alpha
#
# Dois artefatos, por decisão registrada em docs/ARCHITECTURE.md:
#   setup    — instalador NSIS, dados em %APPDATA%\Moductus
#   portable — zip com portable.txt, dados ao lado do executável
#
# Sem atualização automática nesta fase: o plugin updater ainda não está no projeto.
# Quando entrar, chega desligado e o opt-in fica nas configurações.
#
# workflow_dispatch gera e atesta os artefatos sem criar release (ficam na execução).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dependências
        run: pnpm install --frozen-lockfile

      # A versão do instalador vem do tauri.conf.json; tag diferente publicaria um
      # pacote com versão errada por dentro.
      - name: Versão
        shell: pwsh
        run: |
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $versao = $env:GITHUB_REF_NAME
            if ($versao -ne "v$conf") {
              Write-Host "::error::A tag $versao não bate com a versão v$conf do tauri.conf.json"
              exit 1
            }
          } else {
            $versao = "v$conf-$($env:GITHUB_SHA.Substring(0, 7))"
          }
          "VERSAO=$versao" | Out-File -FilePath $env:GITHUB_ENV -Append

      # O beforeBuildCommand (pnpm build) gera o servico.mjs e copia o node.exe como sidecar.
      - name: Build (NSIS)
        run: pnpm tauri build

      - name: Empacota
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pacotes | Out-Null
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe
          if (@($setup).Count -ne 1) { throw "Esperava um instalador NSIS, achei $(@($setup).Count)" }
          Copy-Item $setup.FullName "pacotes/moductus-$env:VERSAO-win-x64-setup.exe"
          ./scripts/empacotar-portable.ps1 -Versao $env:VERSAO -Destino pacotes | Out-Null
          Get-ChildItem pacotes | ForEach-Object {
            Write-Host ("::notice::{0} = {1:N1} MB" -f $_.Name, ($_.Length / 1MB))
          }

      # Permite a qualquer pessoa verificar que o binário veio deste commit.
      # É a única mitigação gratuita que temos contra o aviso do SmartScreen.
      - name: Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            pacotes/*-setup.exe
            pacotes/*-portable.zip

      - name: Guarda na execução
        uses: actions/upload-artifact@v4
        with:
          name: moductus-${{ env.VERSAO }}-win-x64
          path: pacotes/
          if-no-files-found: error

      - name: Anexa ao release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pacotes/*-setup.exe
            pacotes/*-portable.zip
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
