<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: #C4C9D4">Quer rodar <code style="font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 12px; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.08); color: #EEF0F6">npm test</code></div>
