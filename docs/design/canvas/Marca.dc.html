<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Moductus · opções de marca</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 56px; background: #E9E7E2; font-family: 'Geist', 'Segoe UI', system-ui, sans-serif; color: #1A1A18; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px">
<sc-for list="{{opcoes}}" as="c" hint-placeholder-count="4">
<div style="background: #FFFFFF; border: 1px solid rgba(20,20,19,0.08); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-size: 18px; font-weight: 600; letter-spacing: -0.01em">{{c.nome}}</span><span style="font-size: 13px; color: #6B6A64">{{c.letra}}</span></div>
<sc-for list="{{c.fundos}}" as="f" hint-placeholder-count="2">
<div style="{{f.estilo}}">
<div style="font-size: 104px; line-height: 0; display: flex; justify-content: center; padding: 18px 0 6px">
<sc-if value="{{c.a}}" hint-placeholder-val="{{ true }}"><div style="width: 1em; height: 1em; box-sizing: border-box; border: 0.07em solid currentColor; border-radius: 0.28em; padding: 0.11em; display: flex"><div style="width: 0.2em; border-radius: 0.08em; background: currentColor"></div></div></sc-if>
<sc-if value="{{c.b}}" hint-placeholder-val="{{ false }}"><div style="width: 1em; height: 1em; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.09em"><div style="width: 0.56em; height: 0.24em; border-radius: 0.12em; background: currentColor"></div><div style="width: 0.56em; height: 0.24em; border-radius: 0.12em; box-sizing: border-box; border: 0.07em solid currentColor"></div><div style="width: 0.56em; height: 0.24em; border-radius: 0.12em; box-sizing: border-box; border: 0.07em solid currentColor"></div></div></sc-if>
<sc-if value="{{c.c}}" hint-placeholder-val="{{ false }}"><div style="width: 1em; height: 1em; position: relative"><div style="position: absolute; left: 0.24em; top: 0.04em; bottom: 0.04em; width: 0.15em; border-radius: 0.075em; background: currentColor"></div><div style="position: absolute; left: 0.5em; top: 0.08em; width: 0.32em; height: 0.32em; border-radius: 0.16em; background: currentColor"></div></div></sc-if>
<sc-if value="{{c.d}}" hint-placeholder-val="{{ false }}"><div style="width: 1em; height: 1em; display: flex; align-items: flex-end; justify-content: center; gap: 0.1em; box-sizing: border-box; padding: 0.06em 0"><div style="width: 0.22em; height: 0.88em; border-radius: 0.11em; background: currentColor"></div><div style="width: 0.22em; height: 0.56em; border-radius: 0.11em; background: currentColor"></div><div style="width: 0.22em; height: 0.88em; border-radius: 0.11em; background: currentColor"></div></div></sc-if>
</div>
<div style="display: flex; justify-content: center; align-items: flex-end; gap: 22px; padding: 10px 0 16px">
<sc-for list="{{tamanhos}}" as="s" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<div style="{{s.estilo}}">
<sc-if value="{{c.a}}" hint-placeholder-val="{{ true }}"><div style="width: 1em; height: 1em; box-sizing: border-box; border: 0.07em solid currentColor; border-radius: 0.28em; padding: 0.11em; display: flex"><div style="width: 0.2em; border-radius: 0.08em; background: currentColor"></div></div></sc-if>
<sc-if value="{{c.b}}" hint-placeholder-val="{{ false }}"><div style="width: 1em; height: 1em; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.09em"><div style="width: 0.56em; height: 0.24em; border-radius: 0.12em; background: currentColor"></div><div style="width: 0.56em; height: 0.24em; border-radius: 0.12em; box-sizing: border-box; border: 0.07em solid currentColor"></div><div style="width: 0.56em; height: 0.24em; border-radius: 0.12em; box-sizing: border-box; border: 0.07em solid currentColor"></div></div></sc-if>
<sc-if value="{{c.c}}" hint-placeholder-val="{{ false }}"><div style="width: 1em; height: 1em; position: relative"><div style="position: absolute; left: 0.24em; top: 0.04em; bottom: 0.04em; width: 0.15em; border-radius: 0.075em; background: currentColor"></div><div style="position: absolute; left: 0.5em; top: 0.08em; width: 0.32em; height: 0.32em; border-radius: 0.16em; background: currentColor"></div></div></sc-if>
<sc-if value="{{c.d}}" hint-placeholder-val="{{ false }}"><div style="width: 1em; height: 1em; display: flex; align-items: flex-end; justify-content: center; gap: 0.1em; box-sizing: border-box; padding: 0.06em 0"><div style="width: 0.22em; height: 0.88em; border-radius: 0.11em; background: currentColor"></div><div style="width: 0.22em; height: 0.56em; border-radius: 0.11em; background: currentColor"></div><div style="width: 0.22em; height: 0.88em; border-radius: 0.11em; background: currentColor"></div></div></sc-if>
</div>
<span style="font-size: 11px; opacity: 0.7">{{s.rotulo}}</span>
</div>
</sc-for>
</div>
</div>
</sc-for>
<div style="display: flex; align-items: center; gap: 10px; padding-top: 4px">
<div style="font-size: 22px; line-height: 0; color: #1A1A18">
<sc-if value="{{c.a}}" hint-placeholder-val="{{ true }}"><div style="width: 1em; height: 1em; box-sizing: border-box; border: 0.07em solid currentColor; border-radius: 0.28em; padding: 0.11em; display: flex"><div style="width: 0.2em; border-radius: 0.08em; background: currentColor"></div></div></sc-if>
<sc-if value="{{c.b}}" hint-placeholder-val="{{ false }}"><div style="width: 1em; height: 1em; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.09em"><div style="width: 0.56em; height: 0.24em; border-radius: 0.12em; background: currentColor"></div><div style="width: 0.56em; height: 0.24em; border-radius: 0.12em; box-sizing: border-box; border: 0.07em solid currentColor"></div><div style="width: 0.56em; height: 0.24em; border-radius: 0.12em; box-sizing: border-box; border: 0.07em solid currentColor"></div></div></sc-if>
<sc-if value="{{c.c}}" hint-placeholder-val="{{ false }}"><div style="width: 1em; height: 1em; position: relative"><div style="position: absolute; left: 0.24em; top: 0.04em; bottom: 0.04em; width: 0.15em; border-radius: 0.075em; background: currentColor"></div><div style="position: absolute; left: 0.5em; top: 0.08em; width: 0.32em; height: 0.32em; border-radius: 0.16em; background: currentColor"></div></div></sc-if>
<sc-if value="{{c.d}}" hint-placeholder-val="{{ false }}"><div style="width: 1em; height: 1em; display: flex; align-items: flex-end; justify-content: center; gap: 0.1em; box-sizing: border-box; padding: 0.06em 0"><div style="width: 0.22em; height: 0.88em; border-radius: 0.11em; background: currentColor"></div><div style="width: 0.22em; height: 0.56em; border-radius: 0.11em; background: currentColor"></div><div style="width: 0.22em; height: 0.88em; border-radius: 0.11em; background: currentColor"></div></div></sc-if>
</div>
<span style="font-size: 20px; font-weight: 600; letter-spacing: -0.02em">Moductus</span>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var fundos = [
      { estilo: 'background: #111214; color: #E8E9EB; border-radius: 10px;' },
      { estilo: 'background: #F6F5F2; color: #1A1A18; border-radius: 10px; border: 1px solid rgba(20,20,19,0.06);' }
    ];
    var opcoes = [
      { nome: 'Trilho', letra: 'A', a: true },
      { nome: 'Coluna', letra: 'B', b: true },
      { nome: 'Borda e ponto', letra: 'C', c: true },
      { nome: 'M modular', letra: 'D', d: true }
    ].map(function (o) { return Object.assign({ a: false, b: false, c: false, d: false }, o, { fundos: fundos }); });
    var tamanhos = [
      { rotulo: '48', estilo: 'font-size: 48px; line-height: 0;' },
      { rotulo: '32', estilo: 'font-size: 32px; line-height: 0;' },
      { rotulo: '16', estilo: 'font-size: 16px; line-height: 0;' }
    ];
    return { opcoes: opcoes, tamanhos: tamanhos };
  }
}
</script>
</body>
</html>
