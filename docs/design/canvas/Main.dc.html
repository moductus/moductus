<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Moductus · Grafite</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&amp;family=Geist+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E8E9EB}a:hover{color:#FFFFFF}
button{font:inherit;cursor:pointer}
input::placeholder{color:#6F737A}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #191B1F; font-family: 'Geist', 'Segoe UI', system-ui, sans-serif; color: #E8E9EB; font-size: 13px; line-height: 1.4">

<div style="position: absolute; left: 470px; top: 56px; right: 56px; bottom: 56px; background: #141619; border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; display: flex; flex-direction: column; gap: 14px; padding: 18px 22px; box-sizing: border-box">
<div style="display: flex; gap: 8px">
<div style="width: 10px; height: 10px; border-radius: 5px; background: #2A2D32"></div>
<div style="width: 10px; height: 10px; border-radius: 5px; background: #2A2D32"></div>
<div style="width: 10px; height: 10px; border-radius: 5px; background: #2A2D32"></div>
</div>
<div style="width: 46%; height: 10px; border-radius: 5px; background: #1E2125"></div>
<div style="width: 64%; height: 10px; border-radius: 5px; background: #1E2125"></div>
<div style="width: 38%; height: 10px; border-radius: 5px; background: #1E2125"></div>
<div style="width: 58%; height: 10px; border-radius: 5px; background: #1E2125"></div>
</div>

<nav aria-label="Dock" style="position: absolute; left: 0; top: 0; bottom: 0; width: 64px; background: #0D0E10; border-right: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; align-items: center; padding: 14px 0; box-sizing: border-box; gap: 6px">

<div style="width: 26px; height: 26px; position: relative; font-size: 26px; color: #E8E9EB"><div style="position: absolute; left: 0.24em; top: 0.04em; bottom: 0.04em; width: 0.15em; border-radius: 0.075em; background: currentColor"></div><div style="position: absolute; left: 0.5em; top: 0.08em; width: 0.32em; height: 0.32em; border-radius: 0.16em; background: currentColor"></div></div>
</button>
<sc-for list="{{areas}}" as="a" hint-placeholder-count="7">
<button aria-label="{{a.nome}}" style="{{a.estilo}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.d}}"></path></svg>
<sc-if value="{{a.temBadge}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; top: 4px; right: 3px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: #E8E9EB; color: #0D0E10; font-size: 11px; font-weight: 600; line-height: 16px; text-align: center">{{a.badge}}</span>
</sc-if>
<sc-if value="{{a.temTempo}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; bottom: 2px; left: 0; right: 0; text-align: center; font-family: 'Geist Mono', Consolas, monospace; font-size: 11px; color: #E8E9EB">{{a.tempo}}</span>
</sc-if>
</button>
</sc-for>
<div style="width: 24px; height: 1px; background: rgba(255,255,255,0.08); margin: 8px 0"></div>
<sc-for list="{{sessoes}}" as="s" hint-placeholder-count="3">
<button aria-label="{{s.rotulo}}" style="width: 44px; height: 40px; border: 0; background: transparent; position: relative; display: flex; align-items: center; justify-content: center">
<span style="width: 30px; height: 30px; border-radius: 15px; background: #1D2024; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #C9CBCF">{{s.ini}}</span>
<span style="{{s.ponto}}"></span>
</button>
</sc-for>
<div style="width: 24px; height: 1px; background: rgba(255,255,255,0.08); margin: 8px 0"></div>
<sc-for list="{{apps}}" as="p" hint-placeholder-count="4">
<button aria-label="{{p.nome}}" style="width: 44px; height: 40px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
<span style="width: 28px; height: 28px; border-radius: 7px; background: #23262B; color: #9A9DA3; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{p.ini}}</span>
</button>
</sc-for>
<div style="flex: 1"></div>
<button aria-label="Mídia: pausar" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
<span style="width: 30px; height: 30px; border-radius: 6px; background: #2B2F35; display: flex; align-items: center; justify-content: center; color: #E8E9EB">
<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"></path></svg>
</span>
</button>
<button aria-label="Microfone" style="width: 44px; height: 40px; border: 0; background: transparent; color: #9A9DA3; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3zM19 10v2a7 7 0 0 1-14 0v-2M12 19v3"></path></svg>
</button>
<button aria-label="Manter acordado" style="width: 44px; height: 40px; border: 0; background: transparent; color: #9A9DA3; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"></path></svg>
</button>
<div style="font-family: 'Geist Mono', Consolas, monospace; font-size: 12px; color: #9A9DA3; margin-top: 6px">14:32</div>
</nav>

<section aria-label="Painel Hoje" style="position: absolute; left: 76px; top: 12px; width: 368px; background: #131417; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; box-shadow: 0 24px 48px rgba(0,0,0,0.45); padding: 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em">Hoje</h1>
<span style="color: #8C9097; font-size: 12px">terça, 6 de outubro</span>
</div>
<a href="#" style="display: flex; align-items: center; gap: 6px; text-decoration: none; color: #8C9097; font-size: 12px">Abrir sistema <span style="font-family: 'Geist Mono', Consolas, monospace; font-size: 11px; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,0.06); color: #B5B8BD">Ctrl Alt N</span></a>
</div>

<div style="background: #1A1C20; border: 1px solid rgba(255,255,255,0.05); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; color: #8C9097; font-size: 12px"><span>Foco</span><span>2 de 4</span></div>
<div style="font-family: 'Geist Mono', Consolas, monospace; font-size: 36px; font-weight: 400; letter-spacing: -0.02em; line-height: 1">18:42</div>
<div style="color: #B5B8BD">Revisar PR do relatório mensal</div>
<div style="height: 3px; border-radius: 2px; background: rgba(255,255,255,0.08)"><div style="width: 25%; height: 3px; border-radius: 2px; background: #E8E9EB"></div></div>
<div style="display: flex; gap: 8px">
<button style="height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #E8E9EB; font-size: 12px">Pausar</button>
<button style="height: 32px; padding: 0 14px; border-radius: 8px; border: 0; background: transparent; color: #8C9097; font-size: 12px">Encerrar</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; color: #8C9097; font-size: 12px; padding-bottom: 4px"><span>Tarefas</span><span>3 de 7</span></div>
<sc-for list="{{tarefas}}" as="t" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 10px; height: 34px; border-bottom: 1px solid rgba(255,255,255,0.04)">
<span style="{{t.caixa}}"></span>
<span style="{{t.texto}}">{{t.nome}}</span>
<span style="font-family: 'Geist Mono', Consolas, monospace; font-size: 11px; color: #8C9097">{{t.meta}}</span>
</div>
</sc-for>
<label for="captura-a" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Captura rápida</label>
<div style="display: flex; align-items: center; gap: 8px; height: 38px; margin-top: 8px; padding: 0 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); background: #0F1012">
<input id="captura-a" placeholder="ligar pro banco amanhã 15h" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #E8E9EB; font: inherit">
<span style="font-family: 'Geist Mono', Consolas, monospace; font-size: 11px; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,0.06); color: #8C9097">Enter</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; color: #8C9097; font-size: 12px"><span>Outubro</span><span>62% do orçamento</span></div>
<div style="display: flex; align-items: baseline; gap: 6px"><span style="font-family: 'Geist Mono', Consolas, monospace; font-size: 20px">R$ 1.240</span><span style="color: #8C9097">de R$ 1.980</span></div>
<div style="height: 3px; border-radius: 2px; background: rgba(255,255,255,0.08)"><div style="width: 62%; height: 3px; border-radius: 2px; background: #B5B8BD"></div></div>
</div>

<div style="border: 1px solid rgba(255,255,255,0.10); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: #17191C">
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px">
<span style="width: 7px; height: 7px; border-radius: 4px; background: #E3B262"></span>
<span style="color: #E8E9EB; font-weight: 600">Claude Code</span>
<span style="color: #8C9097">api-pedidos</span>
<span style="margin-left: auto; color: #8C9097">agora</span>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: #B5B8BD">Quer rodar <code style="font-family: 'Geist Mono', Consolas, monospace; font-size: 12px; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.06); color: #E8E9EB">npm test</code></div>
<div style="display: flex; gap: 8px; justify-content: flex-end">
<button style="height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); background: transparent; color: #E8E9EB; font-size: 12px">Negar</button>
<button style="height: 32px; padding: 0 14px; border-radius: 8px; border: 0; background: #E8E9EB; color: #0D0E10; font-size: 12px; font-weight: 600">Permitir</button>
</div>
</div>

</section>
</div>
</x-dc>

</body>
